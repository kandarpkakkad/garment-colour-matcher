# Everything that needs a toolchain runs in a throwaway container, so the host
# needs Docker and nothing else (D21). Driven by the scripts in tool/, which
# time-limit every run:
#
#   gradle   engine + app unit tests, the debug APK     tool/test_in_docker.sh, tool/build_in_docker.sh
#   spike    the Python reference: tests, fixtures, bench  tool/spike_in_docker.sh
#   models   download, verify and quantise the models   tool/models_in_docker.sh
#
# Steps live inline rather than in scripts beside them: a Windows checkout with
# core.autocrlf hands the container CRLF scripts, and bash dies on the first \r.
#
# The source is copied in before anything runs, never built in place: a build
# in the checkout would write Linux paths into the host's .gradle and build/.
name: garment-colour-test

x-android: &android
  # Android SDK 36 + JDK 21, the image Habit Force already uses. It carries
  # Flutter too, which is not used here. Move with the CI workflows' JDK.
  image: instrumentisto/flutter:3.38.10
  environment:
    GRADLE_USER_HOME: /gradle-home
  working_dir: /work

x-python: &python
  image: python:3.12-slim
  environment:
    PIP_CACHE_DIR: /pip-cache
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_ROOT_USER_ACTION: ignore
    PYTHONDONTWRITEBYTECODE: "1"
  working_dir: /work

services:
  gradle:
    <<: *android
    volumes:
      # Read-write only so APKs, reports and Room's schema can be copied out.
      - .:/src
      - gradle-home:/gradle-home
    entrypoint:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        tar -C /src \
          --exclude=./.git --exclude=./build --exclude=./.gradle \
          --exclude=./app/build --exclude=./color-engine/build \
          --exclude=./local.properties --exclude=./spike \
          -cf - . | tar -C /work -xf -
        echo "sdk.dir=$$ANDROID_HOME" > local.properties
        mode="$${1:-test}"
        status=0
        case "$$mode" in
          engine)
            bash ./gradlew --no-daemon --console=plain :color-engine:test || status=$$?
            ;;
          dng)
            # Real DNGs in build/check/dng/ through the whole RAW path; renders land in
            # build/check/dng/out/ for a person to look at.
            GCM_DNG_DIR=/src/build/check/dng bash ./gradlew --no-daemon --console=plain \
              :color-engine:test --tests '*RealDngCheck*' || status=$$?
            ;;
          test)
            bash ./gradlew --no-daemon --console=plain \
              :color-engine:test :app:testDebugUnitTest || status=$$?
            ;;
          build)
            bash ./gradlew --no-daemon --console=plain \
              :color-engine:test :app:testDebugUnitTest :app:assembleDebug || status=$$?
            ;;
          *) echo "unknown mode $$mode" >&2; exit 2 ;;
        esac
        # Reports are copied out whether the tests passed or not: a failure is
        # what they are for.
        mkdir -p /src/build/docker/reports
        rm -rf /src/build/docker/reports/*
        for m in color-engine app; do
          if [ -d "$$m/build/reports/tests" ]; then
            cp -r "$$m/build/reports/tests" "/src/build/docker/reports/$$m"
          fi
        done
        if [ -d app/schemas ]; then mkdir -p /src/app/schemas && cp -r app/schemas/. /src/app/schemas/; fi
        [ "$$status" = 0 ] || exit "$$status"
        if [ "$$mode" = build ]; then
          manifest=$$(find app/build/intermediates -path '*merged_manifest*debug*' -name AndroidManifest.xml | head -1)
          if grep -q 'android.permission.INTERNET' "$$manifest"; then
            echo "The merged manifest asks for INTERNET (D3):" >&2
            grep -n 'uses-permission' "$$manifest" >&2
            exit 1
          fi
          echo "merged manifest: no INTERNET permission"
          for abi in arm64-v8a x86_64; do
            cp "app/build/outputs/apk/debug/app-$$abi-debug.apk" "/src/build/docker/garment-colour-debug-$$abi.apk"
          done
          ls -la /src/build/docker/*.apk
        fi
      - gradle
    command: ["test"]

  spike:
    <<: *python
    volumes:
      # Read-write so `fixtures` can replace the engine's test fixtures.
      - .:/src
      - pip-cache:/pip-cache
    entrypoint:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        tar -C /src -cf - spike | tar -C /work -xf -
        pip install -q -r spike/requirements.txt
        cd spike
        mode="$${1:-test}"
        shift || true
        case "$$mode" in
          test) python test_spike.py ;;
          fixtures)
            python make_fixtures.py /work/fixtures
            out=/src/color-engine/src/test/resources/fixtures
            rm -rf "$$out" && mkdir -p "$$out" && cp /work/fixtures/* "$$out/"
            ;;
          bench) python bench.py "$$@" ;;
          *) echo "unknown mode $$mode" >&2; exit 2 ;;
        esac
      - spike
    command: ["test"]

  models:
    <<: *python
    volumes:
      - .:/src
      - pip-cache:/pip-cache
      # Downloads survive between runs; a re-run re-verifies without fetching.
      - model-cache:/model-cache
    entrypoint:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        cp /src/tool/models/fetch_models.py /work/
        pip install -q numpy==2.1.3 onnx==1.17.0 onnxruntime==1.20.1 pillow==11.0.0
        python fetch_models.py --cache /model-cache --out /src/app/src/main/assets/models "$$@"
      - models

volumes:
  gradle-home:
  pip-cache:
  model-cache:
