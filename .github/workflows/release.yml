name: Release

# One version, built twice — a debug APK to try and a signed release APK to
# install.
#
#   Run workflow (minor)   bumps 0.1.7 -> 0.2.0, commits, tags v0.2.0, builds
#   git push v0.2.0        builds the tag exactly as it stands, no bump
on:
  workflow_dispatch:
    inputs:
      level:
        description: 'How far to move the version'
        type: choice
        options: [minor, patch, major]
        default: minor
      version:
        description: 'Or an exact version, e.g. 0.3.0 (overrides the level)'
        required: false
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Two builds instead of one; still far below GitHub's six-hour default (D21).
    timeout-minutes: 60
    permissions:
      contents: write        # the release, the tag, and the version bump

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}

      - name: Version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
            IN_FILE="$(grep -E '^versionName=' version.properties | cut -d= -f2)"
            if [ "$V" != "$IN_FILE" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match version.properties ($IN_FILE). Cut the tag from a commit where they agree."
              exit 1
            fi
          else
            if [ -n "${{ github.event.inputs.version }}" ]; then
              V="$(tool/bump_version.sh set '${{ github.event.inputs.version }}')"
            else
              V="$(tool/bump_version.sh '${{ github.event.inputs.level }}')"
            fi
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add version.properties
            git commit -m "v$V [skip ci]"
            git pull --rebase --autostash
            git push
            # Pushed with GITHUB_TOKEN, which does not trigger another run.
            git tag "v$V"
            git push origin "v$V"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore models
        id: models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: models-${{ hashFiles('tool/models/fetch_models.py') }}

      - name: Fetch models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          pip install -q numpy==2.1.3 onnx==1.17.0 onnxruntime==1.20.1 pillow==11.0.0
          timeout 20m python -I tool/models/fetch_models.py --cache "$RUNNER_TEMP/models" --out app/src/main/assets/models

      # A release must carry its models; a debug build may run without them, a
      # release may not.
      - name: Models present
        run: |
          test -s app/src/main/assets/models/selfie_multiclass_256x256.tflite
          test -s app/src/main/assets/models/segformer_b2_clothes_int8.onnx

      - name: Python reference
        working-directory: spike
        run: |
          pip install -q -r requirements.txt
          timeout 10m python test_spike.py

      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set — the debug APK in this release is signed with a throwaway key."
            exit 0
          fi
          echo "$DEBUG_KEYSTORE_B64" | base64 --decode > debug.keystore

      # Before anything is signed: a red test must not become a release.
      - name: Test and build debug
        run: timeout 30m ./gradlew --no-daemon :color-engine:test :app:testDebugUnitTest :app:assembleDebug

      - name: No INTERNET permission (D3)
        run: |
          manifest=$(find app/build/intermediates -path '*merged_manifest*debug*' -name AndroidManifest.xml | head -1)
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::A dependency brought the INTERNET permission into the merged manifest."
            exit 1
          fi

      - name: Name the debug APKs
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p dist/debug
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "dist/debug/garment-colour-debug-$V-arm64.apk"
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk "dist/debug/garment-colour-debug-$V-x86_64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: garment-colour-debug-${{ steps.version.outputs.version }}
          path: dist/debug/*.apk
          retention-days: 14
          compression-level: 0

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — the build would fall back to the debug key and produce an APK that cannot update anyone's install."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > upload-keystore.jks
          cat > key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release
        run: timeout 30m ./gradlew --no-daemon :app:assembleRelease

      # Proves the artefact is signed by the real key rather than the debug
      # fallback, which is silent and otherwise only noticed by users.
      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate DN|SHA-1 digest"
          if "$APKSIGNER" verify --print-certs "$APK" | grep -qi "CN=Android Debug"; then
            echo "::error::Signed with the DEBUG key — check the keystore secrets."
            exit 1
          fi

      # Android 16 phones are 64-bit: one arm64 APK is the whole release.
      - name: Name the artefact
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/garment-colour-v$V-arm64.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.version.outputs.version }}"
          gh release view "$V" >/dev/null 2>&1 \
            && gh release upload "$V" dist/*.apk --clobber \
            || gh release create "$V" dist/*.apk --title "$V" --generate-notes

      - name: Shred the keys
        if: always()
        run: rm -f upload-keystore.jks key.properties debug.keystore
